spring:
  datasource:
    url: jdbc:mysql://localhost:3306/monsing?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: monsing
    password: monsing
    hikari:
      maximum-pool-size: 35
      minimum-idle: 16
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# JWT 설정
jwt:
  access-token:
    secret: testSecretKeyForLocalDevelopmentDoNotUseInProduction1234567890
    expire-second: 864000  # 10일
  refresh-token:
    secret: refreshSecretKeyForLocalDevelopmentDoNotUseInProduction1234567890
    expire-second: 2592000  # 30일

# S3 설정 (LocalStack)
s3:
  bucket: local-bucket-name

# 로그 레벨 설정
logging:
  level:
    org.monsing: DEBUG
    org.hibernate.SQL: WARN
    software.amazon.awssdk: INFO  # AWS SDK 로깅 추가
