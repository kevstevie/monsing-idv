global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: monsing-api
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['monsing-api:8090']

  - job_name: monsing-chat
    metrics_path: /actuator/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ['monsing-chat:8080']
