server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: monsing
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["monsing-api", "monsing-chat"]

    relabel_configs:
      # 컨테이너 이름에서 앞의 / 제거 → container 레이블
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # 로그 스트림 (stdout / stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"

    pipeline_stages:
      # Spring Boot 로그에서 레벨 추출
      # 예: 2026-02-22T16:49:50.741Z ERROR 1 --- [thread] Logger : message
      - regex:
          expression: '^.*?\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+.*$'
      - labels:
          level:

  # ─── MySQL Slow Query Log ─────────────────────────────────────
  - job_name: mysql-slow-query
    static_configs:
      - targets:
          - localhost
        labels:
          job: mysql-slow-query
          __path__: /var/log/mysql/slow.log

    pipeline_stages:
      # ① 멀티라인: '# Time:' 으로 시작하는 라인이 새 엔트리의 시작
      - multiline:
          firstline: '^# Time: '
          max_wait_time: 3s
          max_lines: 50

      # ② Query_time이 없는 엔트리 제거 (mysqld 시작 헤더 등)
      - drop:
          expression: 'Query_time:'
          negate: true

      # ③ 필드 추출 (dotall (?s) 모드로 멀티라인 파싱)
      #    출력 예: [2.240419s] lock=0.000059s rows=2000000 | select m1_0.id,...
      - regex:
          expression: '(?s)Query_time:\s*(?P<query_time>[0-9.]+)\s+Lock_time:\s*(?P<lock_time>[0-9.]+)\s+Rows_sent:\s*(?P<rows_sent>\d+)\s+Rows_examined:\s*(?P<rows_examined>\d+).*?SET timestamp=\d+;\n(?P<sql>[^\n]+)'

      # ④ 로그 라인을 한눈에 읽히는 형태로 재포맷
      - template:
          source: formatted
          template: '[{{.query_time}}s] lock={{.lock_time}}s rows={{.rows_examined}} | {{.sql}}'

      # ⑤ 재포맷된 라인을 실제 로그 라인으로 설정
      - output:
          source: formatted
