server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: monsing
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["monsing-api", "monsing-chat"]

    relabel_configs:
      # 컨테이너 이름에서 앞의 / 제거 → container 레이블
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # 로그 스트림 (stdout / stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: "stream"

    pipeline_stages:
      # Spring Boot 로그에서 레벨 추출
      # 예: 2026-02-22T16:49:50.741Z ERROR 1 --- [thread] Logger : message
      - regex:
          expression: '^.*?\s+(?P<level>TRACE|DEBUG|INFO|WARN|ERROR)\s+.*$'
      - labels:
          level:
