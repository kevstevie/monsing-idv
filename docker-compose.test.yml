version: '3.8'

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]

  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"

  chat-1:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        MODULE: chat
    container_name: chat-1
    hostname: chat-1
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/chat
      CHAT_SERVER_ID: chat-1:8080
    depends_on:
      - redis
      - mongodb

  chat-2:
    build:
      context: .
      dockerfile: Dockerfile.test
      args:
        MODULE: chat
    container_name: chat-2
    hostname: chat-2
    ports:
      - "8081:8080"
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/chat
      CHAT_SERVER_ID: chat-2:8080
    depends_on:
      - redis
      - mongodb
